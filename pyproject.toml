[project]
name = "grokking-collapse"
version = "0.1.0"
description = "Experimental study of grokking under distributional collapse"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pytest>=9.1.0",
    "scipy>=1.15.3",
    "statsmodels>=0.14.6",
    "pandas>=2.3.3",
    "plotly>=6.8.0",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.3",
    "hydra-core>=1.3.3",
    "black>=26.5.1",
    "isort>=8.0.1",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "autopep8>=2.3.2",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
